seed: 42
image_size: 256

paths:
  raw_root: data/raw/COVID-19_Radiography_Dataset   # change if you use another dataset
  processed: data/processed
  enhanced: data/enhanced
  restored: data/restored
  predicted_masks: data/predicted_masks
  features: data/features
  reports: reports

# Binary task. Edit the lists to change what counts as each class.
classes:
  Normal: 0
  Viral Pneumonia: 1
  Lung_Opacity: 1

split:            # stratified train/val/test
  val: 0.15
  test: 0.15

preprocessing:
  denoise: median        # none | median | gaussian | bilateral | nlm
  denoise_ksize: 3

enhancement:
  clahe: {clip_limit: 2.0, tile_grid: 8}
  homomorphic: {gamma_low: 0.7, gamma_high: 1.5, c: 1.0, d0: 10}
  highpass: {d0: 30, order: 2, boost: 1.0}

restoration:
  psf_sigma: 1.0          # assumed blur of flagged images (Gaussian PSF)
  K: 0.01                 # Wiener noise-to-signal ratio (tune with run_restoration_experiment.py)
  blur_percentile: 5      # images below this sharpness percentile are flagged as blurry
  noise_percentile: 95    # images above this noise percentile are flagged as noisy

dedup:
  hash_size: 16           # 16x16 difference hash = 256 bits
  max_dist: 12            # max differing bits to call two images near-duplicates
